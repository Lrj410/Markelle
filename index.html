<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/markelle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markelle</title>
    <style>
      /* Paint before JS/CSS bundles — kills WebView white/black flash.
         Inline styles cannot read CSS custom properties, so the hex values
         below are hardcoded to mirror src/styles/design-tokens.css. Keep them
         in sync with that file (light + dark). */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        /* = --bg-app / --text-primary (light) */
        background: #ede8dd;
        color: #201b15;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        /* = --bg-app / --text-primary (dark) */
        background: #17140f;
        color: #f2ebdf;
      }
      .boot-inline {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font: 600 15px/1.2 "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
        letter-spacing: 0.04em;
        /* = --text-secondary (light) */
        color: #6b5f50;
      }
      html[data-theme="dark"] .boot-inline {
        /* = --text-secondary (dark) */
        color: #b5a793;
      }
      .boot-mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: currentColor;
        /* = --bg-app (light) */
        color: #ede8dd;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      html[data-theme="dark"] .boot-mark {
        /* = --text-primary / --bg-app (dark) */
        background: #f2ebdf;
        color: #17140f;
      }
      .boot-bar {
        width: 96px;
        height: 3px;
        border-radius: 2px;
        /* = --text-secondary (light) at 25% — warm, not cold gray */
        background: rgba(107, 95, 80, 0.25);
        overflow: hidden;
      }
      html[data-theme="dark"] .boot-bar {
        /* = --text-secondary (dark) at 25% */
        background: rgba(181, 167, 147, 0.25);
      }
      .boot-bar > i {
        display: block;
        height: 100%;
        width: 40%;
        /* = --accent (light) — single vermilion accent, no neon */
        background: #ab3d24;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      html[data-theme="dark"] .boot-bar > i {
        /* = --accent (dark) */
        background: #e0704f;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar > i {
          animation: none;
          width: 100%;
          transform: none;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var scheme = localStorage.getItem("markelle-scheme");
          var dark =
            scheme === "dark" ||
            (scheme !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-inline" aria-busy="true">
        <div class="boot-mark" aria-hidden="true">M</div>
        <div>Markelle</div>
        <div class="boot-bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
