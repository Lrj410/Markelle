name: release

# Tag-driven release (Windows only). Pushing a tag like `v0.1.2` builds the
# Windows installer and attaches it to a GitHub Release. Nothing is published
# until the `verify` job below passes — a broken build can never ship.
#
# The installers are UNSIGNED: Windows SmartScreen will warn on first run
# (users must pick "仍要运行"). Signing is opt-in via the secrets commented in
# the publish step; no signing secrets are required for this workflow to run.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Gate the release on the same checks CI runs. `publish` needs this job, so a
  # type error, failing test, or clippy warning blocks the release.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  publish:
    needs: verify
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        # Code signing is opt-in. To enable it, provide the repository secrets used
        # by your signing setup (e.g. a Windows certificate in the runner cert store
        # plus `bundle.windows.certificateThumbprint`, or a custom `signCommand`),
        # then uncomment the env block below. Without it the installers are unsigned
        # and Windows SmartScreen will warn on first run.
        # env:
        #   WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        #   WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Markelle ${{ github.ref_name }}"
          releaseBody: |
            Markelle ${{ github.ref_name }} — Windows 安装包。

            完整变更见仓库 CHANGELOG.md。
            安装包未签名，首次运行 Windows SmartScreen 可能提示，选择“仍要运行”即可。
          releaseDraft: false
          prerelease: false
          args: ""
