[package]
name = "markelle"
version = "0.1.2"
description = "Markelle — local-first high-performance Markdown knowledge workspace"
authors = ["Lrj410"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markelle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
encoding_rs = "0.8"
chardetng = "0.1"
tauri-plugin-single-instance = "2"
trash = "5"
notify = { version = "6", default-features = true }
memmap2 = "0.9"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# "unwind" (not "abort"): the codebase already recovers from spawn_blocking
# JoinError, and a background panic must not kill the process and lose unsaved work.
panic = "unwind"
strip = true
